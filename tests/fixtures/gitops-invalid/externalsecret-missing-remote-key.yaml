# Every remoteRef needs a key: which secret to read from the store.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: orders-api
  namespace: orders
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: orders-api
  data:
    - secretKey: database-password
      remoteRef:
        property: password
