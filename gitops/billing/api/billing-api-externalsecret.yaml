# Copies every key of the stage/billing/api secret in AWS Secrets Manager into a
# Kubernetes Secret named billing-api. Only the key's name is in git.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: billing-api
  namespace: billing
  labels:
    app.kubernetes.io/name: billing-api
    app.kubernetes.io/part-of: billing
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: billing-api
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: stage/billing/api
