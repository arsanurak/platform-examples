# Copies every key of the stage/billing/web secret in AWS Secrets Manager into a
# Kubernetes Secret named billing-web. Only the key's name is in git.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: billing-web
  namespace: billing
  labels:
    app.kubernetes.io/name: billing-web
    app.kubernetes.io/part-of: billing
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: billing-web
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: stage/billing/web
