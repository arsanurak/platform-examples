apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: orders-web
  namespace: orders
  labels:
    app.kubernetes.io/name: orders-web
    app.kubernetes.io/part-of: orders
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: orders-web
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
