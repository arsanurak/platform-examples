# Copies every key of the stage/orders/web secret in AWS Secrets Manager into a
# Kubernetes Secret named orders-web. Only the key's name is in git.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: orders-web
  namespace: orders
  labels:
    app.kubernetes.io/name: orders-web
    app.kubernetes.io/part-of: orders
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: orders-web
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: stage/orders/web
