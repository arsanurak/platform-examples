# The one way services read secrets: AWS Secrets Manager, through the External
# Secrets operator's Pod Identity role (iac/stage/eks-addons.tf), which can read
# only stage/* secrets. Only the domain namespaces may use this store.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: eu-west-1
  conditions:
    - namespaces:
        - orders
        - billing
