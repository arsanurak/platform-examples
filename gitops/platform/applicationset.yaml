# One Argo CD Application per service folder gitops/<domain>/<service>/, named
# <domain>-<service> and deployed into the <domain> namespace. Adding a service
# is copying a folder; nothing here changes.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: services
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: https://github.com/arsanurak/platform-examples.git
        revision: main
        directories:
          # platform/ is flat on purpose: it has no subfolders, so gitops/*/* never matches it.
          - path: gitops/*/*
  template:
    metadata:
      name: "{{ index .path.segments 1 }}-{{ .path.basename }}"
    spec:
      project: services
      source:
        repoURL: https://github.com/arsanurak/platform-examples.git
        targetRevision: main
        path: "{{ .path.path }}"
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{ index .path.segments 1 }}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        retry:
          limit: 5
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 3m
